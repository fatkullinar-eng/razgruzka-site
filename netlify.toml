# Публикация на Netlify.
# Если загружаете папку massage-site целиком перетаскиванием —
# publish = "." верный. Если подключаете Git-репозиторий целиком,
# поставьте publish = "massage-site".

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Служебные SQL-файлы не должны открываться с сайта
[[redirects]]
  from = "/supabase/*"
  to = "/"
  status = 200

# Исходники фото не отдаём с сайта — на странице только оптимизированные копии
[[redirects]]
  from = "/assets/img/photos/*"
  to = "/"
  status = 200
